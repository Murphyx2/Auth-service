spring:
  application:
    name: Auth-service
  datasource:
    url: "${DB_URL}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  # Disabling H2 for this profile.
  h2:
    console:
      enabled: false
server:
  port: "${APP_PORT}"

# The string should be longer, and It shouldn't be written here, this is just for dev purposes
jwt:
  signing-secret: "${SIGNING_SECRET}"

app:
  bootstrap:
    enabled: "${APP_BOOTSTRAP_ENABLED}"

# Only here for development or testing purposes, I will be removed in a future tickets.
api-key:
  clients:
    client-a: abcd
    client-b: cdef