spring:
  application:
    name: Auth-service
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:test/db/migration
  # Disabling H2 for this profile.
  h2:
    console:
      enabled: true
server:
  port: 8585

# The string should be longer, and It shouldn't be written here, this is just for dev purposes
jwt:
  signing-secret: superlong_secret_for_qa_environment

app:
  bootstrap:
    enabled: true

# Only here for development or testing purposes, I will be removed in a future tickets.
api-key:
  #Clients deprecated
  clients:
    client-a: abcd
    client-b: cdef
  prefix-length: 12
  expired-at-seconds: 7000000
  rate-limit: 1000