spring:
  application:
    name: Auth-service
  security:
    user:
      name: user
      password: password  # Demo credentials (replace in production)
    oauth2:
      authorizationserver:
        client:
          oidc-client:  # Example client for testing
            registration:
              client-id: "oidc-client"
              client-secret: "{noop}secret"  # Use BCrypt in production
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
              redirect-uris:
                - "http://127.0.0.1:8080/login/oauth2/code/oidc-client"
              post-logout-redirect-uris:
                - "http://127.0.0.1:8080/"
              scopes:
                - "openid"
                - "profile"
            require-authorization-consent: true
server:
  port: 9000

# The string should be longer, and It shouldn't be written here, this is just for dev purposes
jwt:
  signing-secret: secret
